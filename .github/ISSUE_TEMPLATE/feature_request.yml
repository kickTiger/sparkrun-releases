name: Feature Request
description: Suggest an improvement or new capability for SparkRun.
title: "[Feature]: "
labels:
  - feature
  - triage
body:
  - type: markdown
    attributes:
      value: |
        Do not submit activation codes, credentials or API keys, databases, private notes, or complete unreviewed logs. Redact personal and confidential details before posting.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to accomplish?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe what you would like SparkRun to do.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Product area
      options:
        - Capture
        - Tasks
        - Projects
        - Solution Canvas
        - Backup and restore
        - Membership
        - Updates
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. Tell us how you work around this today.
    validations:
      required: false
