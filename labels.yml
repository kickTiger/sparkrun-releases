labels:
  - name: bug
    color: d73a4a
    description: Something is not working.
  - name: upgrade
    color: fbca04
    description: Update, download, installation, or post-upgrade issue.
  - name: feature
    color: a2eeef
    description: New feature or product improvement request.
  - name: triage
    color: d4c5f9
    description: Needs initial review.
  - name: needs-info
    color: fef2c0
    description: Waiting for more information from the reporter.
  - name: confirmed
    color: 0e8a16
    description: Reproduced or confirmed by maintainers.
  - name: planned
    color: 1d76db
    description: Accepted and planned.
  - name: in-progress
    color: 0052cc
    description: Work is in progress.
  - name: released
    color: 5319e7
    description: Fixed or shipped in a release.
  - name: duplicate
    color: cfd3d7
    description: Duplicate of another issue.
  - name: platform:windows
    color: 0078d4
    description: Windows-specific issue or request.
  - name: platform:macos
    color: 000000
    description: macOS-specific issue or request.
  - name: channel:stable
    color: 2ea44f
    description: Stable channel.
  - name: channel:beta
    color: dbab09
    description: Beta channel.

